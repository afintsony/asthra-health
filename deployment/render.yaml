services:
  - type: web
    name: astrahealth-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health-check
    envVars:
      - {key: APP_ENV, value: production}
      - {key: DATABASE_URL, fromDatabase: {name: astrahealth-db, property: connectionString}}
      - {key: JWT_SECRET_KEY, generateValue: true}
      - {key: CORS_ORIGINS, sync: false}
databases:
  - name: astrahealth-db
    plan: free
